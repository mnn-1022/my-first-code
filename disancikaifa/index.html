<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnythingLLM 文档上传</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;color:#222}
  h1{font-size:20px}
  .ws{background:#f5f5f5;padding:10px;border-radius:8px;font-size:14px;margin:12px 0;white-space:pre-wrap}
  button{padding:10px 18px;font-size:15px;border:0;border-radius:8px;background:#3b82f6;color:#fff;cursor:pointer}
  button:disabled{background:#9ca3af;cursor:not-allowed}
  #log{background:#0f172a;color:#7dd3fc;font:12px/1.6 monospace;padding:12px;border-radius:8px;margin-top:16px;white-space:pre-wrap;min-height:60px}
</style>
</head>
<body>
<h1>上传文档到 AnythingLLM 第一个工作区并嵌入</h1>
<p>目标工作区：<span id="ws"><i>正在获取…</i></span></p>
<input type="file" id="file">
<button id="btn" disabled>上传并嵌入</button>
<div id="log">// 过程中请勿关闭页面</div>

<script>
const API = 'http://localhost:3001/api';
const KEY = 'FW1EYFB-WTQMN2R-G8EHNS2-54TSSGN';
const log = document.getElementById('log');
const btn = document.getElementById('btn');
const wsEl = document.getElementById('ws');
let slug = null;

const show = (m) => { log.textContent += m + '\n'; log.scrollTop = log.scrollHeight; };
const auth = { 'Authorization': 'Bearer ' + KEY };

async function fetchJSON(url, opt) {
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error(url + ' -> HTTP ' + r.status + ' ' + await r.text());
  return r.json();
}

(async function init() {
  try {
    const data = await fetchJSON(API + '/v1/workspaces', { headers: auth });
    const ws = data.workspaces[0];
    if (!ws) throw new Error('没有工作区');
    slug = ws.slug;
    wsEl.textContent = ws.name + ' (' + ws.slug + ')';
    btn.disabled = false;
  } catch (e) {
    wsEl.textContent = '获取工作区失败';
    show('初始化失败: ' + e.message);
  }
})();

btn.onclick = async () => {
  const f = document.getElementById('file').files[0];
  if (!f) return alert('请先选择文件');
  btn.disabled = true;
  const fd = new FormData();
  fd.append('file', f);
  try {
    show('1. 上传文件 ' + f.name + ' …');
    const up = await fetchJSON(API + '/v1/document/upload', { method: 'POST', headers: auth, body: fd });
    show('   上传成功: 已解析 ' + up.documents.length + ' 个文档');
    const locations = up.documents.map(d => d.location);
    show('2. 嵌入到工作区 ' + slug + ' …');
    const emb = await fetchJSON(API + '/v1/workspace/' + slug + '/update-embeddings', {
      method: 'POST', headers: { ...auth, 'Content-Type': 'application/json' }, body: JSON.stringify({ adds: locations })
    });
    show('3. 完成! 文档已向量化嵌入');
    show(JSON.stringify({ upload: up.documents, workspace: emb.workspace }, null, 2));
  } catch (e) {
    show('出错: ' + e.message);
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
